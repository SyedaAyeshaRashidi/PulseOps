<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseOps — Alert History</title>
    <style>
        :root {
            --bg: #07090e;
            --card-bg: #0f131d;
            --border: #1e2638;
            --accent-red: #ff2a5f;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            padding: 32px 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
            margin-bottom: 24px;
        }
        h1 { font-size: 1.8em; font-family: var(--font-mono); }
        h1 span { color: var(--accent-red); }
        .back-btn {
            background: #1a2233;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.85em;
        }
        .back-btn:hover { background: #fff; color: #000; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        th, td { padding: 14px 18px; text-align: left; font-family: var(--font-mono); font-size: 0.9em; }
        th { background: #141a27; color: var(--text-sub); border-bottom: 1px solid var(--border); font-size: 0.8em; text-transform: uppercase; }
        td { border-bottom: 1px solid rgba(255,255,255,0.04); }
        .subject { color: var(--accent-red); font-weight: 700; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pulse<span>Ops</span> / Alert History</h1>
        <a href="/" class="back-btn">← DASHBOARD</a>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 20%;">Timestamp</th>
                <th style="width: 30%;">Subject</th>
                <th style="width: 50%;">Details</th>
            </tr>
        </thead>
        <tbody id="alerts-body">
            <tr><td colspan="3" style="text-align:center; color: var(--text-sub);">Loading history...</td></tr>
        </tbody>
    </table>

    <script>
        fetch('/api/history/alerts')
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('alerts-body');
                if(!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-sub);">No alerts recorded in database.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(a => `
                    <tr>
                        <td style="color: var(--text-sub);">${a.time}</td>
                        <td class="subject">${a.subject}</td>
                        <td>${a.message.replace(/\n/g, '<br>')}</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
